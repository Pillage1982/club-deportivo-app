<!DOCTYPE html>
<!-- Verificación pública de cartas de permiso para el colegio: el QR de la carta
     trae ?c=<código>; también se puede escribir el código a mano. Muestra solo lo
     que dice la carta (folio, alumno, colegio, fechas) para que el colegio
     confirme que la emitió la agrupación. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Verificar carta — Unión Morenada Centralista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body { background: #f4f1ee; color: #24170e; }
    .verificar-card { max-width: 480px; margin: 40px auto; padding: 0 16px; }
    .verificar-membrete { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #2b1608; padding-bottom: 10px; margin-bottom: 18px; }
    .verificar-membrete img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
    .verificar-membrete b { color: #2b1608; letter-spacing: .04em; line-height: 1.3; display: block; }
    .btn-gdc { background: #d5152b; color: #fff; }
    .btn-gdc:hover { background: #a90f21; color: #fff; }
  </style>
</head>
<body>
  <main class="verificar-card">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="verificar-membrete">
          <img src="img/logo-morenada.png" alt="Unión Morenada Centralista">
          <b>BAILE RELIGIOSO<br>UNIÓN MORENADA CENTRALISTA</b>
        </div>
        <h1 class="h5 mb-3">Verificar carta de permiso</h1>

        <form id="form_verificar" class="d-flex gap-2 mb-3" novalidate>
          <label for="codigo" class="visually-hidden">Código de verificación</label>
          <input type="text" id="codigo" class="form-control text-uppercase" maxlength="12"
            placeholder="Código de la carta" autocomplete="off">
          <button type="submit" class="btn btn-gdc">Verificar</button>
        </form>

        <div id="resultado" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <script>
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
      'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    function escaparHtml(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function fechaLarga(iso) {
      const [anio, mes, dia] = String(iso).substring(0, 10).split('-').map(Number);
      return `${dia} de ${MESES[mes - 1]} de ${anio}`;
    }

    function verificar(codigo) {
      const resultado = document.getElementById('resultado');
      const limpio = String(codigo || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (limpio.length !== 8) {
        resultado.innerHTML = '<div class="alert alert-warning mb-0">El código tiene 8 letras y números.</div>';
        return;
      }

      resultado.innerHTML = '<p class="text-muted mb-0">Verificando...</p>';
      fetch(`/publico/cartas-permiso/${encodeURIComponent(limpio)}`)
        .then(async res => ({ ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) }))
        .then(({ ok, status, data }) => {
          if (ok && data.valida) {
            resultado.innerHTML = `
              <div class="alert alert-success">
                <i class="bi bi-patch-check-fill me-1"></i>
                <strong>Carta válida</strong>, emitida por la Unión Morenada Centralista.
              </div>
              <dl class="row mb-0 small">
                <dt class="col-5">Folio</dt><dd class="col-7">${escaparHtml(data.folio)}</dd>
                <dt class="col-5">Alumno</dt><dd class="col-7">${escaparHtml(data.alumno)}</dd>
                <dt class="col-5">Colegio</dt><dd class="col-7">${escaparHtml(data.colegio)}</dd>
                <dt class="col-5">Curso</dt><dd class="col-7">${escaparHtml(data.curso)}</dd>
                <dt class="col-5">Permiso</dt><dd class="col-7">${fechaLarga(data.fecha_desde)} al ${fechaLarga(data.fecha_hasta)}</dd>
                <dt class="col-5">Emitida</dt><dd class="col-7">${fechaLarga(data.emitida_en)}</dd>
                <dt class="col-5">Firma</dt><dd class="col-7">${escaparHtml(data.firmante)}</dd>
              </dl>`;
          } else if (status === 429) {
            resultado.innerHTML = `<div class="alert alert-warning mb-0">${escaparHtml(data.mensaje || 'Demasiadas consultas. Intenta en unos minutos.')}</div>`;
          } else {
            resultado.innerHTML = `
              <div class="alert alert-danger mb-0">
                <i class="bi bi-x-octagon-fill me-1"></i>
                No existe una carta aprobada con ese código. Revisa que esté bien escrito.
              </div>`;
          }
        })
        .catch(() => {
          resultado.innerHTML = '<div class="alert alert-danger mb-0">No se pudo verificar. Revisa tu conexión.</div>';
        });
    }

    document.getElementById('form_verificar').addEventListener('submit', e => {
      e.preventDefault();
      verificar(document.getElementById('codigo').value);
    });

    const codigoUrl = new URLSearchParams(window.location.search).get('c');
    if (codigoUrl) {
      document.getElementById('codigo').value = codigoUrl;
      verificar(codigoUrl);
    }
  </script>
</body>
</html>
