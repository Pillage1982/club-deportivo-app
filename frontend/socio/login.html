<!DOCTYPE html>
<!-- Portal del Socio — login por RUT + PIN (no reutiliza el login admin: token, storage y endpoint son propios). -->
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <title>Portal del Socio</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- Misma identidad visual del login admin (frontend/css/login.css) -->
  <link rel="stylesheet" href="../css/login.css">

</head>

<body>

  <div class="background-shape shape1"></div>
  <div class="background-shape shape2"></div>

  <div class="login-card">

    <div class="logo">
      <img src="../img/logo-jjvv.jpg" alt="Junta de Vecinos El Aromo del Portal" class="login-logo">
    </div>

    <h2 class="text-center">Portal del Socio</h2>
    <p class="text-center">Junta de Vecinos El Aromo del Portal</p>

    <div class="mb-3 login-input-group">
      <i class="bi bi-person-vcard-fill"></i>
      <input
        type="text"
        id="rut"
        class="form-control"
        placeholder="RUT (Ej: 12345678-9)"
        autocomplete="username">
    </div>

    <div class="mb-4 login-input-group">
      <i class="bi bi-key-fill"></i>
      <input
        type="password"
        id="pin"
        class="form-control"
        placeholder="PIN (6 dígitos)"
        inputmode="numeric"
        maxlength="6"
        autocomplete="current-password">
      <button type="button" id="togglePin" class="toggle-password">
        <i class="bi bi-eye-fill"></i>
      </button>
    </div>

    <button id="btnLogin" onclick="loginSocio()" class="btn-login">
      Ingresar
    </button>

    <div id="respuesta"></div>

    <p class="text-center mt-3 mb-0" style="font-size: 0.85rem; opacity: 0.75;">
      ¿No tienes tu PIN? Pídelo a la directiva.
    </p>

  </div>

  <p class="login-credit">
    Diseño de Mario Riquelme
  </p>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
