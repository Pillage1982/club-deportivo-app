<!DOCTYPE html>
<!-- Cambio de clave del panel admin: obligatorio en el primer ingreso (clave genérica de la directiva). -->
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>GDC.APP | Cambiar clave</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/login.css">

  <script>
    if (!localStorage.getItem('token')) {
      window.location.replace('login.html');
    }
  </script>

</head>

<body>

  <div class="background-shape shape1"></div>
  <div class="background-shape shape2"></div>

  <div class="login-card">

    <div class="logo">
      <i class="bi bi-shield-lock-fill" style="color:#f47a22;"></i>
    </div>

    <h2 class="text-center">Cambiar clave</h2>
    <p class="text-center">
      Por seguridad, debes cambiar tu clave antes de continuar.
    </p>

    <div class="mb-3 login-input-group">
      <i class="bi bi-key-fill"></i>
      <input
        type="password"
        id="password_actual"
        class="form-control"
        placeholder="Clave actual"
        autocomplete="current-password">
    </div>

    <div class="mb-3 login-input-group">
      <i class="bi bi-shield-lock-fill"></i>
      <input
        type="password"
        id="password_nueva"
        class="form-control"
        placeholder="Clave nueva (mínimo 8 caracteres)"
        autocomplete="new-password">
    </div>

    <div class="mb-4 login-input-group">
      <i class="bi bi-shield-lock-fill"></i>
      <input
        type="password"
        id="password_nueva_confirmar"
        class="form-control"
        placeholder="Confirma la clave nueva"
        autocomplete="new-password">
    </div>

    <button id="btn_cambiar_password" onclick="cambiarPassword()" class="btn-login">
      Guardar nueva clave
    </button>

    <div id="respuesta"></div>

    <p class="text-center mt-3 mb-0">
      <a href="#" id="link_salir" style="color:#f47a22; font-size:0.85rem;">
        Cerrar sesión
      </a>
    </p>

  </div>

  <p class="login-credit">
    Diseño de Mario Riquelme
  </p>

  <script src="js/cambiar-password.js"></script>
</body>
</html>
